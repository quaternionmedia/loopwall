[project]
name = "loopwall"
version = "0.0.2"
description = "A live-performance video wall for loop-based music."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "click>=8.1",
    "rich>=13",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
hapax = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "hypothesis>=6",
    "ruff>=0.8",
    "httpx2>=2.7.0",
    "playwright>=1.62.0",
]

[project.scripts]
loopwall = "loopwall.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopwall"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
# governance/qm is a vendored submodule (its own repo, own lint config,
# not ours to fix from here). ci.yml's own checkout fetches it
# (submodules: true), so without this exclude `ruff check .` fails in CI
# too, not just locally - confirmed by hitting exactly that failure
# (a B904 inside the submodule's own project-seed/ci/) this session.
extend-exclude = ["governance/qm"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: requires real capture/MIDI hardware; skipped in CI",
]

[tool.coverage.run]
source = ["src/loopwall"]
